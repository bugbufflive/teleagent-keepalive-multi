services:
  teleagent-multi:
    build: .
    image: teleagent-multi:latest
    container_name: teleagent-multi
    restart: unless-stopped
    ports:
      # 宿主机端口由 .env 里的 PANEL_PORT 控制，默认 8580
      - "${PANEL_PORT:-8580}:8580"
    environment:
      TZ: Asia/Shanghai
      PORT: "8580"
      DATA_DIR: /app/data
      LOG_MAX: "300"
      LOG_FILE_MAX_MB: "5"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # 面板访问密码：.env 里填了 WEB_PASSWORD 才生效，留空 = 不鉴权
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
      WEB_USER: "${WEB_USER:-admin}"
      # 全局默认机器人 webhook（每个账号也可以单独配自己的）
      # WECOM_WEBHOOK: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8580/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 8s
      start_period: 20s
      retries: 3

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
